# XcodeGen spec. Regenerate the Xcode project after any change here or after adding/removing files:
#   cd ios && xcodegen generate
# The generated ClipDeck.xcodeproj is git-ignored; this file is the source of truth.
name: ClipDeck

options:
  bundleIdPrefix: dev.brent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only; use "1,2" to add iPad
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""                 # set your Apple team id for device builds (not needed for the simulator)

packages:
  # LGPL-2.1 FFmpeg (n8.1.3) as dynamic xcframeworks, for the MKV import (docs/ARCHITECTURE.md > FFmpeg).
  # Pinned to one exact tag; see THIRD_PARTY_NOTICES.md before changing it.
  FFmpegBuild:
    url: https://github.com/superuser404notfound/FFmpegBuild
    exactVersion: 3.16.0
  # MIT. Unzips Yomitan dictionaries (docs/ARCHITECTURE.md > Dictionary store). Notice: THIRD_PARTY_NOTICES.md.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19

targets:
  ClipDeck:
    type: application
    platform: iOS
    sources:
      - path: ClipDeck
        excludes:
          - "Resources/Licenses"
      # Licence and notice texts, kept as a folder so the app bundle has Licenses/<name>.txt.
      - path: ClipDeck/Resources/Licenses
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brent.clipdeck
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: FFmpegBuild
        product: AetherLibavformat
      - package: FFmpegBuild
        product: AetherLibavcodec
      - package: FFmpegBuild
        product: AetherLibavutil
      - package: FFmpegBuild
        product: AetherLibswresample
      # Link-only backends: AetherLibavcodec and AetherLibavformat load these at launch (@rpath),
      # so they must be linked and embedded too or the app fails to start.
      - package: FFmpegBuild
        product: AetherLibdav1d
      - package: FFmpegBuild
        product: AetherLibzvbi
      - package: ZIPFoundation
    info:
      path: ClipDeck/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # Without these XcodeGen writes 1.0 / 1. The About screen and the release IPAs read the real version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # AnkiConnect only speaks plain HTTP, and its address is whatever the user types (LAN IP,
        # hostname, or a VPN name like Tailscale). The app makes no other network requests.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        # iOS asks for this the first time the app contacts Anki on the local network.
        NSLocalNetworkUsageDescription: "Clip Deck connects to Anki on your computer to send the cards you've made."
        # Show Documents (Videos/, Subtitles/) in the Files app under On My iPhone > Clip Deck.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Audio keeps playing a clip if the screen locks mid-playback.
        UIBackgroundModes: [audio]

  ClipDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClipDeckTests
    dependencies:
      - target: ClipDeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.brent.clipdeck.tests

  ClipDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ClipDeckUITests
    dependencies:
      - target: ClipDeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.brent.clipdeck.uitests
        TEST_TARGET_NAME: ClipDeck

schemes:
  ClipDeck:
    build:
      targets:
        ClipDeck: all
        ClipDeckTests: [test]
        ClipDeckUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ClipDeckTests
        - ClipDeckUITests
    archive:
      config: Release

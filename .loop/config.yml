project: clip-deck
stack: ios-swiftui
ci_only: true                 # Windows, no Mac: Swift builds/tests only in GitHub Actions
mode: pause                   # pause | auto
git: commit                   # commit | pr
tracker: github               # local | github | both
push: true                    # loop branch is pushed anyway for CI
branch_prefix: loop/
max_fix_rounds: 3
default_branch: main
models:
  builders: sonnet            # sonnet | opus (override: run --opus, or model: in a task)
  ask_on_sonnet_fail: true    # after a failed Sonnet round, ask: retry on Sonnet or switch to Opus
commands:
  build: "./scripts/build-ipa.sh"
  test: "./scripts/test-ios.sh"
  lint: ""
  run: "./scripts/run-ios.sh"
ci:
  mode: conservative          # conservative | normal (SKILL.md "CI budget"); repo is public since 2026-11-20, so minutes are free
  max_runs_per_task: 4
  workflow: ios-simulator.yml
  trigger: "gh workflow run ios-simulator.yml --ref <branch> [-f scope=all|tests|ipa] [-f only_testing=Target/Class]"   # pushes to non-main branches do NOT trigger it
  artifacts: [simulator-results-1, simulator-results-2, simulator-results-3, ClipDeck-ipa]

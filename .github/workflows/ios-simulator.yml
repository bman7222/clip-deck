# Builds the app, runs unit + UI tests, launches it in an iPhone simulator and uploads screenshots.
# Useful as the "virtual iPhone" when developing without a Mac, and as CI on any machine.
# Results: GitHub > Actions > run > Artifacts (or `gh run download <run-id>`).
name: iOS simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    # Conservative CI (dev loop, .loop/config.yml ci.mode): run only what a change needs.
    inputs:
      scope:
        description: "all = tests + ipa; tests = simulator jobs only (four shards); ipa = ipa job only"
        type: choice
        options: [all, tests, ipa]
        default: all
      only_testing:
        description: "Optional xcodebuild -only-testing target, e.g. ClipDeckUITests/AboutUITests (empty = all tests; non-empty runs only that filter, in one job)"
        type: string
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which simulator shards run. The tests are split in four parallel jobs so a full run fits the
  # timeout and each job stays near 22-25 min (T-024a: with three jobs shard 1 took 33:49 in CI 45204137687).
  #   shard 1 = ClipDeckTests + the UI classes in SHARD1_UI + the launch screenshot
  #   shard 2 = the UI classes in SHARD2_UI
  #   shard 3 = the UI classes in SHARD3_UI
  #   shard 4 = everything else (-skip-testing of ClipDeckTests and the three lists), so a new UI class or a
  #             new test target always runs somewhere.
  # Timing, CI 45204137687 (three shards): shard 1 33:49 (MoveTextUITests alone took 556 s of it), shard 2 28:08,
  # shard 3 26:51; CI 45002423211 gave UI minutes per class (CardTester 3.7, FontTester 2.8, UpLimitTester 2.0,
  # SubtitleFont 1.3, MiningFlow 0.7; About 4.4, SubtitleStyle 4.0, PlayerLandscapeBehaviour 3.6). The split below is
  # an estimate from those numbers; to rebalance, move class names between the lists. A non-empty only_testing runs
  # just that filter in shard 1; the other shards are not created, and a shard whose list is empty is left out.
  plan:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'ipa'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan shards
        id: plan
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          SHARD1_UI="SubtitleStyleCardTesterUITests SubtitleFontTesterUITests SubtitleFontUITests MiningFlowUITests PlaybackOverlayUITests SubtitleAvoidOverlayUITests"
          SHARD2_UI="AboutUITests SubtitleStyleUITests PlayerLandscapeBehaviourUITests"
          SHARD3_UI="MoveTextUITests MoveTextTesterUITests SubtitleStyleSheetTesterUITests SubtitleStyleCardUITests"
          only1="ClipDeckTests"; only2=""; only3=""; skip4="ClipDeckTests"
          for c in $SHARD1_UI; do only1="$only1 ClipDeckUITests/$c"; skip4="$skip4 ClipDeckUITests/$c"; done
          for c in $SHARD2_UI; do only2="$only2 ClipDeckUITests/$c"; skip4="$skip4 ClipDeckUITests/$c"; done
          for c in $SHARD3_UI; do only3="$only3 ClipDeckUITests/$c"; skip4="$skip4 ClipDeckUITests/$c"; done
          only2="${only2# }"; only3="${only3# }"
          ONLY_TESTING="$(printf '%s' "$ONLY_TESTING" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          if [ -n "$ONLY_TESTING" ]; then
            matrix="$(jq -nc --arg o "$ONLY_TESTING" '{include:[{shard:1,only:$o,skip:"",screenshot:false}]}')"
          else
            # Shards 2 and 3 are left out when their lists are empty (they would otherwise run with no filter).
            matrix="$(jq -nc --arg o1 "$only1" --arg o2 "$only2" --arg o3 "$only3" --arg s4 "$skip4" '{include:(
              [{shard:1,only:$o1,skip:"",screenshot:true}]
              + (if $o2 == "" then [] else [{shard:2,only:$o2,skip:"",screenshot:false}] end)
              + (if $o3 == "" then [] else [{shard:3,only:$o3,skip:"",screenshot:false}] end)
              + [{shard:4,only:"",skip:$s4,screenshot:false}])}')"
          fi
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  simulator:
    needs: plan
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'ipa'
    name: simulator (shard ${{ matrix.shard }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install xcodegen and ffmpeg
        # ffmpeg is a build-time tool only: scripts/make-test-media.sh uses it to generate the MKV test fixtures.
        run: brew install xcodegen ffmpeg

      - name: Create local config from examples
        run: |
          cp -n .env.example .env || true
          cp -n ios/Config/Secrets.example.xcconfig ios/Config/Secrets.xcconfig || true

      - name: Unit and UI tests
        env:
          ONLY_TESTING: ${{ matrix.only }}
          SKIP_TESTING: ${{ matrix.skip }}
        run: bash scripts/test-ios.sh

      - name: Launch in simulator and screenshot
        if: matrix.screenshot
        run: bash scripts/run-ios.sh

      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simulator-results-${{ matrix.shard }}
          path: |
            build/screenshots
            build/*.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # Unsigned build for your own iPhone: download "ClipDeck-ipa" from the run page and install it
  # with Sideloadly (Windows/Mac), which signs it with your Apple ID.
  ipa:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'tests'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Create local config from examples
        run: cp -n ios/Config/Secrets.example.xcconfig ios/Config/Secrets.xcconfig || true

      - name: Build unsigned IPA
        run: bash scripts/build-ipa.sh

      - name: Check licence notices are inside the IPA
        run: bash scripts/check-ipa-notices.sh build/ipa/ClipDeck.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: ClipDeck-ipa
          path: build/ipa/ClipDeck.ipa
          retention-days: 30
